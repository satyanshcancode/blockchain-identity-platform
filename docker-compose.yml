version: "3.9"

services:
  hardhat-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hardhat-node
    ports:
      - "8545:8545"
    volumes:
      - shared-addresses:/shared

  backend:
    build:
      context: ./backend
    container_name: platform-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - RPC_URL=http://hardhat-node:8545
      # The LAN address other devices reach this machine on - see the root
      # .env / .env.example. Used here to build the CORS allowlist for the
      # ROLE-GATED routes, so an operator running the console over the LAN
      # isn't locked out of the admin panel. The PUBLIC verification routes
      # accept any origin instead (they're unauthenticated read-only by
      # design, and are loaded by phones scanning a QR code) - see
      # src/config/cors.js for the split.
      - PUBLIC_HOST=${PUBLIC_HOST:-localhost}
      - FRONTEND_PORT=3000
      # Persistent home for the indexer's SQLite (sql.js) event store - see
      # backend/src/db.js. Backed by the event-db volume below so it survives
      # `docker compose down`/`up`, not just an in-session container restart.
      - EVENTS_DB_PATH=/data/events.db
      # Contract addresses are no longer hardcoded here. scripts/deploy.js
      # (run by hardhat-node's entrypoint) writes them to the shared volume
      # below right after deployment, and backend/src/config/loadAddresses.js
      # waits for and reads that file on startup. This removes the old
      # "check the logs and update these by hand" failure point.
      # Well-known Hardhat default account #0 (the deploy.js deployer, which holds
      # ADMIN_ROLE). Backend uses this to sign auditor/admin-gated read calls like
      # GET /api/assets/:tokenId/history. DEV ONLY — this key is public, never use
      # it or this pattern with real funds or on a public network.
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    volumes:
      - shared-addresses:/shared
      - event-db:/data
    depends_on:
      - hardhat-node

  frontend:
    build:
      context: ./frontend
    container_name: platform-frontend
    ports:
      - "3000:3000"
    environment:
      # Single configurable origin for everything that leaves this machine -
      # see frontend/src/config/origins.js and the root .env.example.
      # REACT_APP_PUBLIC_BASE_URL is the origin baked into asset QR codes;
      # REACT_APP_API_BASE_URL is where the browser sends API reads. Both
      # previously defaulted to localhost, which is unreachable from the
      # phone doing the scanning - that was the QR verification bug.
      # react-scripts inlines REACT_APP_* at dev-server boot, so changing
      # PUBLIC_HOST needs a full `docker compose down && docker compose up -d`.
      # Recreating only this service is NOT enough and actively hangs: with
      # hardhat-node left running there's no new deploy, so scripts/
      # loadAddresses.js correctly refuses the now-stale addresses.json and
      # waits out its timeout. Same applies to the backend.
      - PUBLIC_HOST=${PUBLIC_HOST:-localhost}
      - REACT_APP_PUBLIC_BASE_URL=http://${PUBLIC_HOST:-localhost}:3000
      - REACT_APP_API_BASE_URL=http://${PUBLIC_HOST:-localhost}:4000
      # Hardhat's default local chain ID - used only for the "wrong network"
      # warning in WalletConnect.
      - REACT_APP_CHAIN_ID=31337
    volumes:
      - shared-addresses:/shared
    depends_on:
      - backend

volumes:
  shared-addresses:
  event-db: